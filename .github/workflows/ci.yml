name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests
      - name: Static lint
        run: ruff check app tests --select E9,F821,F823,F841
      - name: Run tests
        run: pytest
      - name: Start local API smoke test
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/harness-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health.json
          python scripts/smoke_test.py
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/benchmarks/evaluate > /tmp/benchmark.json
          grep -q '"cases":20' /tmp/benchmark.json

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and start services
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Exercise benchmark endpoint
        run: |
          python scripts/smoke_test.py
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/benchmarks/evaluate | grep -q '"cases":20'
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
